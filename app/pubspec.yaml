name: marcos_barber
description: "Agenda e gestao para a Marcos Barber."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_symbols_icons: ^4.2960.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.0
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    # Substituto livre do Visuelt Pro, que o app de referencia usa e e
    # comercial. Mesma pegada geometrica e x-height alto.
    - family: Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
