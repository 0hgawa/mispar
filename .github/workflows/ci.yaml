name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  FLUTTER_VERSION: 3.47.3

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  android:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: echo '${{ secrets.CONFIG_PROD_JSON }}' > config/prod.json
      - run: flutter build appbundle --dart-define-from-file=config/prod.json

  ios:
    needs: check
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: echo '${{ secrets.CONFIG_PROD_JSON }}' > config/prod.json
      # Sem assinatura: valida que compila. A assinatura entra na esteira de release.
      - run: flutter build ios --no-codesign --dart-define-from-file=config/prod.json
